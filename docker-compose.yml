# BE-02 — hạ tầng dev cục bộ. Đúng hai dịch vụ, không thêm gì khác.
# Không có pgvector (dự án đã bỏ RAG), không có MinIO (BE-11), không có pgAdmin.

name: luxmap

services:
  postgres:
    # Multi-arch amd64 + arm64: Windows/x86 và Mac Apple Silicon đều chạy native,
    # không ai cần `platform:` và không ai phải chạy emulation.
    # postgis/postgis chính thức KHÔNG có bản arm64 cho bất kỳ tag PostgreSQL 17 nào.
    # imresamu là maintainer chính của docker-postgis, cùng lineage Dockerfile.
    image: imresamu/postgis:17-3.5
    container_name: luxmap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luxmap_dev}
      POSTGRES_USER: ${POSTGRES_USER:-luxmap}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?chưa set POSTGRES_PASSWORD, hãy chạy `cp .env.example .env`}"
      # Contract mục 0 + mục 5.2: mọi TIMESTAMPTZ đọc/ghi bằng DateTimeKind.Utc.
      # Container lệch múi giờ gây lỗi rất khó tìm, nên ép UTC ở cả OS lẫn client.
      TZ: UTC
      PGTZ: UTC
    # `-c timezone=UTC` ép thẳng GUC, không phụ thuộc initdb suy ra từ TZ của OS.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      # Bind vào 127.0.0.1: không phơi database ra LAN.
      # Cổng host đọc từ biến môi trường, mặc định 5433 vì 5432 có thể đã bị
      # PostgreSQL cài native chiếm.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Chỉ rõ -U/-d: pg_isready mặc định dùng user `root` của container và luôn fail.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luxmap} -d ${POSTGRES_DB:-luxmap_dev} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.1-alpine
    container_name: luxmap_redis
    restart: unless-stopped
    environment:
      TZ: UTC
    # Cache thuần, không persistence: không có named volume nên dữ liệu vốn đã
    # mất khi recreate. Tắt hẳn RDB/AOF để tránh ghi đĩa vô ích và để ý định rõ ràng.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: luxmap_postgres_data
