name: CI

# Require this job on dev WITH "Require branches to be up to date before merging", or a
# merge queue. YAML alone cannot invalidate yesterday's green check after another PR merges.
on:
  pull_request:
    branches: [dev]
    # A PR that changes only prose skips the run: no build input, test, or generator reads these paths. Order matters — a later
    # pattern overrides an earlier one, so docs/openapi/** (read by OpenApiSpecTests and the stale-spec check) is put back last.
    # A skipped run reports no check at all: if this job ever becomes a required check, a docs-only PR will wait on it forever —
    # replace this filter with an in-job change check at that point. merge_group ignores path filters, so the queue always runs.
    paths:
      - '**'
      - '!docs/**'
      - '!.ai/**'
      - '!**/*.md'
      - 'docs/openapi/**'
  # A queue tests the candidate INCLUDING earlier queued PRs; omitting this trigger leaves
  # required checks pending on the queue's SHA. Enable the queue in repository settings.
  merge_group:
    types: [checks_requested]
    branches: [dev]

# PR code executes here, including fork code. It needs neither repository secrets nor write access.
permissions:
  contents: read

concurrency:
  # Cancel only an obsolete run of THIS PR/ref, never another PR's required check.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Merge result / ${{ matrix.shard }}
    # Compose has fixed container/volume names. A fresh hosted VM per job is load-bearing:
    # self-hosted runners or a shared external DB would race sequence resets and teardown.
    runs-on: ubuntu-24.04
    # The suite's wall time is AssetDatabaseCollection, which runs one class after another by design (see that file), and
    # WorkOrderTests is half of it. Each shard is its own VM, so each gets its own Testcontainers PostGIS and its own
    # pole_id_seq: the collection stays serial INSIDE a shard, and no two shards ever share a database.
    # The two filters are exact complements, so every test runs in exactly one shard. A shard is a whole class or more —
    # never split a class, and keep a class's fixtures on the shard of the class.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: work-orders
            target: tests/LuxMap.Api.Tests/LuxMap.Api.Tests.csproj
            filter: FullyQualifiedName~LuxMap.Api.Tests.WorkOrderTests.
          - shard: rest
            target: LuxMap.slnx
            filter: FullyQualifiedName!~LuxMap.Api.Tests.WorkOrderTests.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # github.sha is the PR's synthetic MERGE commit, or the merge-group candidate.
          # NEVER substitute pull_request.head.sha: #46's Solar test + #47's enum removal
          # compiled on their branches separately and broke only when combined on dev.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test photo survey tool (standard library, offline)
        # Checks that do not depend on the shard run once, on the work-orders shard (with the OpenAPI steps below).
        if: ${{ matrix.shard == 'work-orders' }}
        run: python3 -m unittest discover -s scripts/tests

      - name: Create ephemeral configuration
        # AuthTestExtensions.SeedPassword walks upward to a REAL .env and reads it directly.
        # Merely exporting SEED_* variables breaks the current suite before its first login.
        # Generate credentials rather than borrowing a developer's DB or repository secrets.
        run: |
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          # EVERY key docker-compose.yml interpolates, plus the ones the app fails fast on.
          # A missing port here does not fall back to a default: compose renders an empty port
          # mapping and the service never starts, which surfaces far from the cause.
          values = {
              'POSTGRES_DB': 'luxmap_dev',
              'POSTGRES_USER': 'luxmap',
              'POSTGRES_PORT': '5433',
              'REDIS_PORT': '6380',
              'MINIO_ACCESS_KEY': 'luxmap',
              'MINIO_PORT': '9000',
              'MINIO_CONSOLE_PORT': '9001',
              'MINIO_ENDPOINT': 'http://localhost:9000',
              # BE-33a fails fast without these. Nothing listens there: the suite swaps in a
              # recording sender, and a real send would only be logged as failed.
              'SMTP_HOST': 'localhost',
              'SMTP_PORT': '1025',
              'SMTP_FROM_ADDRESS': 'no-reply@luxmap.local',
              'SMTP_FROM_NAME': 'LuxMap',
              'WEB_APP_BASE_URL': 'http://localhost:5173',
              # LC-12: the EMQX of the broker end-to-end tests calls the test host back on this port.
              'MQTT_PORT': '1883',
              'MQTT_CALLBACK_PORT': '5199',
              'EMQX_DASHBOARD_PORT': '18083',
          }
          for key in ('POSTGRES_PASSWORD', 'MINIO_SECRET_KEY', 'JWT_SIGNING_KEY',
                      'SEED_ADMIN_PASSWORD', 'SEED_AGENCY_PASSWORD',
                      'SEED_ENGINEER_PASSWORD', 'SEED_CREW_PASSWORD',
                      'Mqtt__CallbackKey', 'Mqtt__BackendPassword', 'EMQX_DASHBOARD_PASSWORD'):
              values[key] = secrets.token_hex(32)
          Path('.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY

      # apt-get is not used: the hosted runners' Ubuntu mirror failed DNS (azure.archive.ubuntu.com) three times in a row on PR #230,
      # and before that a slow mirror ate whole jobs (runs 39932392185, 39972880761). A pinned static build from GitHub Releases, checked
      # against its SHA-256, also makes the frame-extraction tests run on the same ffmpeg / ffprobe every time. The step limit makes a
      # stalled download fail here, by name, instead of eating the job's budget.
      - name: Install frame extraction tools
        timeout-minutes: 8
        run: |
          bundle="$RUNNER_TEMP/luxmap-ffmpeg"
          mkdir -p "$bundle"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz \
            -o "$bundle/ffmpeg.tar.xz"
          echo "41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380  $bundle/ffmpeg.tar.xz" | sha256sum --check
          tar -xJf "$bundle/ffmpeg.tar.xz" -C "$bundle" --strip-components=1
          echo "$bundle/bin" >> "$GITHUB_PATH"
          "$bundle/bin/ffmpeg" -hide_banner -version
          "$bundle/bin/ffprobe" -hide_banner -version

      - name: Restore
        run: |
          dotnet restore LuxMap.slnx -warnaserror
          dotnet tool restore

      - name: Build every project, including tests
        id: build
        # Building only LuxMap.Api misses a test still referring to a removed enum value.
        # -warnaserror covers MSBuild warnings as well as compiler/analyzer warnings.
        run: dotnet build LuxMap.slnx --no-restore -warnaserror

      - name: Re-export and regenerate OpenAPI
        id: spec
        if: ${{ matrix.shard == 'work-orders' }}
        # Only host-building tools need these values. Job-level CORS configuration contaminates
        # the regression test that deliberately starts with no allowlist.
        env:
          Swagger__Enabled: 'true'
          Cors__AllowedOrigins__0: https://localhost:3000
        run: |
          dotnet swagger tofile --output docs/openapi/luxmap-v1.json src/LuxMap.Api/bin/Debug/net10.0/LuxMap.Api.dll v1
          python3 docs/openapi/tools/gen_consolidated_spec.py

      - name: Reject stale committed specs
        if: ${{ !cancelled() && steps.spec.outcome == 'success' }}
        # Drift 40: code can change an endpoint/schema while a perfectly valid JSON spec stays
        # stale. Lint alone cannot detect that. Export FROM THE BUILT MERGE RESULT, regenerate
        # the consolidated file, then compare BOTH against that commit, without hand-editing.
        # When the contract version changes, update this filename and the generator together.
        run: git diff --exit-code -- docs/openapi/luxmap-v1.json docs/openapi/luxmap-v1.5.json

      - name: Lint consolidated OpenAPI
        if: ${{ !cancelled() && steps.spec.outcome == 'success' }}
        # The consolidated spec supplies operationIds and contract-only endpoints; linting only
        # the raw exporter output would miss that surface. Pin rules to avoid surprise CI changes.
        run: npx --yes @redocly/cli@2.0.0 lint docs/openapi/luxmap-v1.5.json

      - name: Start the MQTT broker
        id: services
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # BE-36: the database is no longer a service here. LuxMap.Api.Tests starts its own PostGIS
        # container (Testcontainers, tests/LuxMap.Api.Tests/TestDatabase.cs) and migrates and seeds it,
        # so CI and a laptop prepare the database the same way, in the same code.
        # MinIO is NOT started because it can no longer be pulled anonymously: Docker Hub
        # minio/* returns 404 (BE-11) and quay.io/minio/* answers 401 "Requires authentication"
        # (26/09/2026, still 401 on 11/10/2026). An S3 integration test must pick a new image source first.
        # LC-12: EMQX (profile `mqtt`) for MqttEndToEndTests — the only tests that need a real broker: it alone enforces the
        # ACL the API's callback answers. It probes the callback before the test host exists and retries every 15 s; the
        # tests wait for that themselves.
        run: docker compose --profile mqtt up -d --wait --wait-timeout 180 emqx

      - name: Run regression suite shard
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        # One database per shard (see the matrix). Keep the existing xUnit AssetDatabaseCollection serialization intact.
        # Runsettings excludes Category=Benchmark. The shard's --filter is ANDed with that filter, not a replacement — which is
        # what a shard needs, and also why a CLI filter can never select benchmarks; use luxmap.benchmark.runsettings for those.
        # LUXMAP_MQTT_E2E turns the broker end-to-end tests on (they skip without it, e.g. on a laptop with no EMQX). Both shards
        # start the broker, so an end-to-end test cannot silently skip by landing on the other shard.
        env:
          LUXMAP_MQTT_E2E: "1"
        run: >-
          dotnet test "${{ matrix.target }}" --no-build --no-restore --settings luxmap.runsettings
          --filter "${{ matrix.filter }}" --logger trx --results-directory .github/test-results -m:1

      - name: Preserve test failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: .github/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop service containers
        if: ${{ always() && steps.services.outcome != 'skipped' }}
        # The hosted VM discards volumes after the job; no shared volume cleanup is needed.
        run: docker compose --profile mqtt down
